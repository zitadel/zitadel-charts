{{- if .Values.login.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zitadel.login.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "login.labels" . | nindent 4 }}
  {{- with .Values.login.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.login.revisionHistoryLimit }}
  revisionHistoryLimit: {{ .Values.login.revisionHistoryLimit }}
  {{- end }}
  {{- if not .Values.login.autoscaling.enabled }}
  replicas: {{ .Values.login.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "login.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.login.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap_login.yaml") . | sha256sum }}
        {{- if not .Values.login.loginServiceKeySecretName }}
        checksum/secret-login-service-key: {{ include (print $.Template.BasePath "/secret_login-service-key.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.login.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9464"
        {{- end }}
      labels:
        {{- include "login.labels" . | nindent 8 }}
        {{- with .Values.login.podAdditionalLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "login.serviceAccountName" . }}
      securityContext:
        {{- include "login.podSecurityContext" . | nindent 8 }}
      enableServiceLinks: false
      containers:
      {{- if .Values.login.extraContainers }}
        {{- toYaml .Values.login.extraContainers | nindent 8 }}
      {{- end }}
        - name: {{ include "zitadel.login.name" . }}
          securityContext:
            {{- include "login.securityContext" . | nindent 14 }}
          image: "{{ .Values.login.image.repository }}:{{ .Values.login.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.login.image.pullPolicy }}
          env:
            - name: NEXT_PUBLIC_BASE_PATH
              value: /ui/v2/login
            {{- if .Values.login.metrics.enabled }}
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: "9464"
            {{- end }}
            {{- /* ZITADEL_EXTERNALDOMAIN is consumed by the login container's
                   entrypoint.sh as a shell variable expanded into the .env
                   file (see configmap_login.yaml: ${ZITADEL_EXTERNALDOMAIN}
                   in AUDIENCE and CUSTOM_REQUEST_HEADERS). We auto-default it
                   from .Values.zitadel.configmapConfig.ExternalDomain so the
                   common case (chart-value path) works unchanged. Users who
                   instead source the domain at runtime (e.g. valueFrom a
                   ConfigMap or Secret) mirror the same entry into login.env;
                   we skip the auto-default in that case to avoid the K8s
                   duplicate-env-name validation error. */ -}}
            {{- $userHasExternalDomain := false -}}
            {{- range .Values.login.env -}}
              {{- if eq .name "ZITADEL_EXTERNALDOMAIN" -}}
                {{- $userHasExternalDomain = true -}}
              {{- end -}}
            {{- end }}
            {{- if and .Values.zitadel.configmapConfig.ExternalDomain (not $userHasExternalDomain) }}
            - name: ZITADEL_EXTERNALDOMAIN
              value: {{ .Values.zitadel.configmapConfig.ExternalDomain | quote }}
            {{- end }}
            {{- /* ZITADEL_SESSION_COOKIE_SECRET signs the Login UI session
                   cookie (Login UI v4.19.2 and later, ignored by older
                   images). The chart only references a Secret the user
                   provides; it never generates one. Skipped when the user
                   sets the variable in login.env, to avoid the K8s
                   duplicate-env-name validation error. */ -}}
            {{- $userHasSessionCookieSecret := false -}}
            {{- range .Values.login.env -}}
              {{- if eq .name "ZITADEL_SESSION_COOKIE_SECRET" -}}
                {{- $userHasSessionCookieSecret = true -}}
              {{- end -}}
            {{- end }}
            {{- if and .Values.login.sessionCookieSecretName (not $userHasSessionCookieSecret) }}
            - name: ZITADEL_SESSION_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.login.sessionCookieSecretName | quote }}
                  key: ZITADEL_SESSION_COOKIE_SECRET
            {{- end }}
            {{- with .Values.login.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
          - containerPort: {{ include "login.containerPort" . }}
            name: {{ .Values.login.service.protocol }}-server
            protocol: TCP
          {{- if .Values.login.metrics.enabled }}
          - containerPort: 9464
            name: metrics
            protocol: TCP
          {{- end }}
          {{- if .Values.login.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ include "login.livenessProbePath" . }}
              port: {{ .Values.login.service.protocol }}-server
              scheme: {{ .Values.login.service.scheme }}
            initialDelaySeconds: {{ .Values.login.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.login.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.login.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.login.livenessProbe.failureThreshold }}
            {{- with .Values.login.livenessProbe.terminationGracePeriodSeconds }}
            terminationGracePeriodSeconds: {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Values.login.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ include "login.readinessProbePath" . }}
              port: {{ .Values.login.service.protocol }}-server
              scheme: {{ .Values.login.service.scheme }}
            initialDelaySeconds: {{ .Values.login.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.login.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.login.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.login.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.login.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.login.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ include "login.startupProbePath" . }}
              port: {{ .Values.login.service.protocol }}-server
              scheme: {{ .Values.login.service.scheme }}
            periodSeconds: {{ .Values.login.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.login.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.login.startupProbe.failureThreshold }}
            {{- with .Values.login.startupProbe.terminationGracePeriodSeconds }}
            terminationGracePeriodSeconds: {{ . }}
            {{- end }}
          {{- end }}
          volumeMounts:
          - name: login-config-dotenv
            mountPath: /.env-file/
            readOnly: true
          - name: login-service-key
            mountPath: /login-service-key
            readOnly: true
          {{- with .Values.login.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.login.resources | nindent 14 }}
      # The chart ships no wait-for-zitadel init container: the login container
      # waits for the backend natively (its readiness probe stays unready, HTTP
      # 503, until the backend is reachable, without restarting). The block below
      # only renders user-supplied init containers from login.initContainers.
      {{- with .Values.login.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: login-config-dotenv
        configMap:
          name: {{ include "login.configmapName" . }}
      - name: login-service-key
        secret:
          secretName: {{ include "zitadel.loginServiceKeySecretName" . }}
          defaultMode: 0440
          items:
            - key: tls.key
              path: tls.key
      {{- with .Values.login.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.login.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.login.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.login.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.login.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
