{{- if and .Values.zitadel.adminServiceKey.enabled (not .Values.zitadel.adminServiceKey.existingSecretName) }}
{{- $secretName := printf "%s-admin-service-key" (include "zitadel.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "tls.crt") (hasKey $existingSecret.data "tls.key") }}
{{- /* Reuse existing keypair to prevent admin key rotation on upgrade */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $existingSecret.data "tls.crt" }}
  tls.key: {{ index $existingSecret.data "tls.key" }}
{{- else }}
{{- /* Generate a self-signed RSA certificate for the IAM admin system user.
       The public cert (tls.crt) is mounted into ZITADEL for JWT verification
       via SystemAPIUsers.admin-client (IAM_OWNER). The private key (tls.key)
       is NOT consumed by any pod: operators read it out of this Secret and use
       it to authenticate against the ZITADEL System API with a JWT profile —
       the declarative replacement for the old imperatively-created machine key.
       During helm template or --dry-run, lookup returns empty so a fresh cert
       is always shown; actual installs/upgrades preserve the existing cert. */ -}}
{{- $cert := genSelfSignedCert "admin-service" nil (list "admin-service") (int .Values.zitadel.adminServiceKey.validityDays) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
