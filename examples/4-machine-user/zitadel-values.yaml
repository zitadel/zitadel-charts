zitadel:
  masterkey: x123456789012345678901234567891y
  # Administrative API access is provided declaratively by the admin-client
  # system user. The chart generates its keypair into the Secret
  # "my-zitadel-admin-service-key"; read the private key (tls.key) out of it and
  # authenticate against the ZITADEL API with a JWT profile. This is enabled by
  # default (zitadel.adminServiceKey.enabled=true), so nothing extra is needed
  # here. To bring your own key instead, set
  # zitadel.adminServiceKey.existingSecretName to a kubernetes.io/tls secret.
  configmapConfig:
    ExternalDomain: machine.127.0.0.1.sslip.io
    ExternalPort: 443
    TLS:
      Enabled: false
    Database:
      Postgres:
        Host: db-postgresql
        Port: 5432
        Database: zitadel
        MaxOpenConns: 20
        MaxIdleConns: 10
        MaxConnLifetime: 30m
        MaxConnIdleTime: 5m
        User:
          Username: postgres
          SSL:
            Mode: disable
        Admin:
          Username: postgres
          SSL:
            Mode: disable
ingress:
  enabled: true
login:
  ingress:
    enabled: true
