name: 'Release Charts'

on:
  push:
    branches:
      # Stable releases. chart-releaser publishes whatever version sits in
      # Chart.yaml on this branch.
      - 'main'
      # Pre-release line for the next major (semantic-release style). Pushing a
      # pre-release version (e.g. 11.0.0-beta.N) here publishes it without
      # touching the stable channel on main. SemVer pre-releases are hidden from
      # a normal `helm install` and surface only with `--devel` or an explicit
      # `--version`, so stable users are never moved onto the beta line.
      - 'next'

jobs:
  release:

    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'write'
      packages: 'write'
      id-token: 'write'

    steps:
      - id: 'checkout'
        uses: 'actions/checkout@v5.0.0'
        with:
          fetch-depth: "0"

      - id: 'configure-git'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - id: 'helm-deps'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/zitadel

      - id: 'release'
        uses: 'helm/chart-releaser-action@v1.7.0'
        env:
          CR_GENERATE_RELEASE_NOTES: 'true'
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: 'login-ghcr'
        name: 'Login to GitHub Container Registry'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - id: 'package-and-push-oci'
        name: 'Package and Push OCI Image'
        run: |
          CHART_VERSION=$(grep '^version:' charts/zitadel/Chart.yaml | awk '{print $2}')
          helm package charts/zitadel
          helm push zitadel-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/zitadel-charts
